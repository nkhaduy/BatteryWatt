name: Feature request
description: Suggest a focused improvement for BatteryWatt
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Product fit
      options:
        - label: This keeps BatteryWatt focused on battery power.
          required: true
        - label: This does not require analytics, accounts, or cloud sync.
          required: true
