name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package release
        env:
          CODESIGN_IDENTITY: ${{ secrets.BATTERYWATT_CODESIGN_IDENTITY }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "BatteryWatt $version" \
            --generate-notes \
            dist/BatteryWatt-"$version".dmg \
            dist/BatteryWatt-"$version".zip \
            dist/SHA256SUMS.txt

